name: CI

on:
  pull_request:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.entry.os || 'ubuntu-latest' }} / Ruby ${{ matrix.entry.ruby || '3.4' }} / git ${{ matrix.entry.git || 'latest' }}
    strategy:
      fail-fast: false
      matrix:
        entry:
          - { ruby: "2.7", git: "1.13.0" }
          - { ruby: "3.0", git: "2.3.3" }
          - { ruby: "3.1" }
          - { ruby: "3.2", git: "4.3.0" }
          - { ruby: "3.3", git: "5.7.1" }
          - { git: "6.0.0" }
          - { os: macos-latest }
          - { os: windows-latest }
    runs-on: ${{ matrix.entry.os || 'ubuntu-latest' }}
    env:
      GIT_VERSION: ${{ matrix.entry.git }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.entry.ruby || '3.4' }}
          bundler-cache: true
          cache-version: git-${{ matrix.entry.git || 'latest' }}

      - name: Report git gem version
        run: bundle info git

      - name: Configure Git email/username
        run: |
          git config --global user.email "orta+dangersystems@artsy.net"
          git config --global user.name "Danger.Systems"

      - name: Linting
        run: bundle exec rubocop

      - name: Running Tests
        run: bundle exec rake spec

      - name: Running the Dangerfile for this repo
        if: runner.os != 'Windows'
        run: |
          TOKEN='7469b4e94ce21b43e3ab7a'
          TOKEN+='79960c12a1e067f2ec'
          DANGER_GITHUB_API_TOKEN=$TOKEN RUNNING_IN_ACTIONS=true bundle exec danger --verbose
